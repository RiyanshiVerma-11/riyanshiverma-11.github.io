<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B267"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A"/>
  
  <!-- Subtle neon border -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.8"/>
  
  <!-- Code brackets </ > -->
  <g fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M22 23 L13 32 L22 41"/>
    <!-- Slash / -->
    <path d="M28 43 L36 21"/>
    <!-- Right bracket > -->
    <path d="M42 23 L51 32 L42 41"/>
  </g>
  
  <!-- AI Neural pulse dot -->
  <circle cx="51" cy="14" r="3.5" fill="#22C55E"/>
</svg>
